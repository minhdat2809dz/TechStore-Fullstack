version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: techstore-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - techstore-network

  web:
    build: .
    container_name: techstore-app
    restart: always
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DATABASE=TechStoreDB
      - DB_MODE=mongo
    depends_on:
      - mongo
    networks:
      - techstore-network

networks:
  techstore-network:
    driver: bridge

volumes:
  mongo_data:
